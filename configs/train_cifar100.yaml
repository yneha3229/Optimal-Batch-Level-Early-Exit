# Joint backbone + exit-head fine-tuning, ViT-B/16 (ImageNet-21k) on CIFAR-100, images resized 32 -> 224
task: cifar100
kind: vision
backbone: google/vit-base-patch16-224-in21k
exit_layers: [2, 4, 6, 8, 10, 12]
num_labels: 100
image_size: 224
epochs: 4
batch_size: 128
lr: 5.0e-5
head_lr: 1.0e-3
weight_decay: 0.05
warmup_frac: 0.1
label_smoothing: 0.1
dropout: 0.0
eval_batch: 256
log_every: 100
seed: 0
