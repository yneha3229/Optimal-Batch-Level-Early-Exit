# Joint backbone + exit-head fine-tuning, RoBERTa-base on QQP (from the pretrained checkpoint)
task: qqp
kind: text
backbone: roberta-base
tokenizer: roberta-base
init_heads_from_classifier: false
exit_layers: [2, 4, 6, 8, 10, 12]
num_labels: 2
max_len: 128
epochs: 2
batch_size: 64
lr: 3.0e-5
head_lr: 2.0e-4
weight_decay: 0.01
warmup_frac: 0.06
dropout: 0.1
eval_batch: 256
log_every: 500
seed: 0
